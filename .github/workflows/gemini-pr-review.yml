name: Gemini Code Review

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Google Generative AI SDK
        run: npm install @google/generative-ai

      - name: Get git diff for PR
        run: |
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > diff.txt
          head -c 20000 diff.txt > diff_trimmed.txt

          echo "Diff size:"
          wc -c diff.txt
          echo "Trimmed diff size:"
          wc -c diff_trimmed.txt

      - name: Run Gemini Review
        id: gemini_review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const diffOutput = fs.readFileSync("diff_trimmed.txt", "utf8");

            if (!diffOutput.trim()) {
              fs.writeFileSync("review_result.txt", "변경사항 diff가 비어 있어 리뷰할 내용이 없습니다.");
              return;
            }

            const { GoogleGenerativeAI } = require("@google/generative-ai");
            const genAI = new GoogleGenerativeAI("${{ secrets.GEMINI_API_KEY }}");
            const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

            const prompt = `
            너는 우리 팀 프로젝트의 코드 리뷰어야.

            아래 git diff를 보고 한국어로 코드 리뷰를 작성해줘.

            리뷰 기준:
            - 버그 가능성
            - 빌드 실패 가능성
            - 보안 문제
            - 환경변수나 secret 노출 여부
            - 불필요한 코드 또는 console.log
            - 테스트가 필요한 부분
            - 리뷰어가 꼭 확인해야 할 부분

            무시할 것:
            - 단순 코드 스타일
            - 들여쓰기
            - 불필요한 말투 지적

            요구사항:
            - Markdown 형식으로 작성
            - 너무 길게 쓰지 말 것
            - 중요한 문제 위주로 작성
            - 문제가 없으면 "큰 문제는 없어 보입니다."라고 작성

            아래는 이번 Pull Request의 git diff입니다.

            <git diff>
            ${diffOutput}
            </git diff>
            `;

            const result = await model.generateContent(prompt);
            const response = await result.response;
            const text = response.text();

            fs.writeFileSync("review_result.txt", text);
            console.log("Review results saved.");

      - name: Comment on Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const review = fs.readFileSync("review_result.txt", "utf8");

            const body = `## 🤖 Gemini Code Review\n\n${review}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });