name: Gemini PR Review

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-pr-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        run: |
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > diff.txt
          head -c 20000 diff.txt > diff_trimmed.txt

          echo "Diff size:"
          wc -c diff.txt

          echo "Trimmed diff size:"
          wc -c diff_trimmed.txt

      - name: Run Gemini Review
        id: gemini_review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require("fs");

            const diffOutput = fs.readFileSync("diff_trimmed.txt", "utf8");

            if (!diffOutput.trim()) {
              fs.writeFileSync("review_result.txt", "변경사항 diff가 비어 있어 리뷰할 내용이 없습니다.");
              return;
            }

            const prompt = `
            너는 우리 팀 프로젝트의 코드 리뷰어야.

            아래 git diff를 보고 한국어로 코드 리뷰를 작성해줘.

            리뷰 기준:
            - 버그 가능성
            - 빌드 실패 가능성
            - 보안 문제
            - 환경변수나 secret 노출 여부
            - 불필요한 코드 또는 console.log
            - 테스트가 필요한 부분
            - 리뷰어가 꼭 확인해야 할 부분

            특히 다음 파일이 변경되면 더 주의해서 봐줘.
            - Dockerfile
            - docker-compose.yml
            - .github/workflows/*
            - .env
            - application-prod.yml
            - nginx 설정 파일
            - package.json
            - package-lock.json

            요구사항:
            - Markdown 형식으로 작성
            - 너무 길게 쓰지 말 것
            - 중요한 문제 위주로 작성
            - 단순 코드 스타일이나 들여쓰기는 지적하지 말 것
            - 문제가 없으면 "큰 문제는 없어 보입니다."라고 작성

            아래는 이번 Pull Request의 git diff입니다.

            <git diff>
            ${diffOutput}
            </git diff>
            `;

            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  contents: [
                    {
                      parts: [
                        {
                          text: prompt
                        }
                      ]
                    }
                  ]
                })
              }
            );

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`Gemini API error: ${response.status} ${errorText}`);
            }

            const data = await response.json();

            const text =
              data.candidates?.[0]?.content?.parts?.[0]?.text ||
              "Gemini 리뷰 결과를 가져오지 못했습니다.";

            fs.writeFileSync("review_result.txt", text);
            console.log("Review results saved.");

      - name: Comment on Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const review = fs.readFileSync("review_result.txt", "utf8");

            const body = `## 🤖 Gemini PR Review

            ${review}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });