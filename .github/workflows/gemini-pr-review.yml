name: Gemini PR Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-pr-review:
    runs-on: ubuntu-latest

    env:
      GEMINI_CLI_TRUST_WORKSPACE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        run: |
          git fetch origin ${{ github.base_ref }} ${{ github.head_ref }}
          git diff origin/${{ github.base_ref }}...origin/${{ github.head_ref }} > /tmp/pr_diff.txt

          echo "Diff size:"
          wc -c /tmp/pr_diff.txt

      - name: Read PR Diff
        id: read_diff
        run: |
          {
            echo 'diff<<EOF'
            head -c 20000 /tmp/pr_diff.txt
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Gemini PR Review
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            너는 우리 팀 프로젝트의 코드 리뷰어야.
            아래는 이번 Pull Request의 git diff 일부야.
            이 변경사항만 보고 한국어로 짧게 리뷰해줘.

            리뷰 기준:
            1. 버그 가능성
            2. 보안 문제
            3. 테스트 필요 여부
            4. 리뷰어가 꼭 확인할 부분

            문제가 없으면 "큰 문제는 없어 보입니다"라고 작성해줘.

            Git Diff:
            ${{ steps.read_diff.outputs.diff }}

      - name: Comment Gemini review on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/gemini-review.md <<'EOF'
          ## 🤖 Gemini PR Review

          ${{ steps.gemini.outputs.summary }}
          EOF

          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/gemini-review.md